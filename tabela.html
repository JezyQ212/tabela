
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Trzecia tabela</title>
<style>
    table {
        border-collapse: collapse;
        text-align: center;
        margin: 20px;
        font-size: 18px;
    }

    td {
        border: 1px solid #555;
        width: 60px;
        height: 48px;
    }

    .nr {
        background-color: #bce4f5;
    }

    .merged {
        background-color: #c8e0ad;
    }
</style>
</head>
<body>

<h2>Trzecia tabela</h2>

<table>
    <tr>
        <td class="nr">1</td>
        <td class="nr">2</td>
        <td class="nr">3</td>
        <td class="nr">4</td>
        <td class="nr">5</td>
        <td class="nr">6</td>
    </tr>
    <tr>
        <td class="nr">2</td>
        <td>a</td>
        <td>b</td>
        <td>c</td>
        <td>d</td>
        <td>e</td>
    </tr>
    <tr>
        <td class="nr">3</td>
        <td>f</td>
        <td>g</td>
        <td>h</td>
        <td>i</td>
        <td>j</td>
    </tr>
    <tr>
        <td class="nr">4</td>
        <td>k</td>
        <td>l</td>
        <td rowspan="3" class="merged">m, r, w</td>
        <td>n</td>
        <td>o</td>
    </tr>
    <tr>
        <td class="nr">5</td>
        <td>p</td>
        <td>q</td>
        <td>s</td>
        <td>t</td>
    </tr>
    <tr>
        <td class="nr">6</td>
        <td>u</td>
        <td>v</td>
        <td>y</td>
        <td>z</td>
    </tr>
</table>

</body>
</html>
